name: Check portal

on:
  schedule:
    # GitHub cron is UTC and ignores DST. These three lines run every 30 min from
    # 14:00 to 01:00 UTC = 7am-6pm PDT (UTC-7). When clocks fall back to PST (UTC-8) this
    # becomes 6am-5pm; shift every hour below by +1 (15-23, 0-1, 2:00) to keep 7am-6pm.
    - cron: '*/30 14-23 * * *'
    - cron: '*/30 0 * * *'
    - cron: '0 1 * * *'
  workflow_dispatch: # manual "Run workflow" button
    inputs:
      debug:
        description: Save screenshots + HTML of each step as a downloadable artifact
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - run: npx playwright install --with-deps chromium

      - name: Scrape portal and notify me
        run: npm start
        env:
          DEBUG_DUMP: ${{ inputs.debug && '1' || '' }}
          PORTAL_URL: ${{ vars.PORTAL_URL || 'https://mybizaccount.fedex.com' }}
          PORTAL_USER: ${{ secrets.PORTAL_USER }}
          PORTAL_PASS: ${{ secrets.PORTAL_PASS }}
          NOTIFY_METHOD: ${{ vars.NOTIFY_METHOD || 'email' }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_NUMBER: ${{ secrets.TWILIO_NUMBER }}
          MY_PHONE: ${{ secrets.MY_PHONE }}

      - name: Upload screenshots
        if: failure() || inputs.debug
        uses: actions/upload-artifact@v4
        with:
          name: portal-screenshots
          path: artifacts/
          if-no-files-found: ignore
