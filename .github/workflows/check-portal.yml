name: Check portal

on:
  schedule:
    # GitHub cron is UTC and ignores DST. These three lines run every 30 min at :07 and :37 from
    # 17:07 to 01:07 UTC = about 10am-6pm PDT (UTC-7). Off-peak minutes on purpose: GitHub delays or
    # drops runs at :00 and :30. When clocks fall back to PST (UTC-8) on Nov 1 this becomes 9am-5pm;
    # shift every hour below by +1 (18-23, 0, 2) to keep 10am-6pm.
    - cron: '7,37 17-23 * * *'
    - cron: '7,37 0 * * *'
    - cron: '7 1 * * *'
  workflow_dispatch: # manual "Run workflow" button
    inputs:
      debug:
        description: Save screenshots + HTML of each step as a downloadable artifact
        type: boolean
        default: false

permissions:
  contents: read
  actions: write # lets the job disable this workflow after a failed login

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - run: npx playwright install --with-deps chromium

      - name: Scrape portal and notify me
        run: npm start
        env:
          DEBUG_DUMP: ${{ inputs.debug && '1' || '' }}
          PORTAL_URL: ${{ vars.PORTAL_URL || 'https://mybizaccount.fedex.com' }}
          PORTAL_USER: ${{ secrets.PORTAL_USER }}
          PORTAL_PASS: ${{ secrets.PORTAL_PASS }}
          NOTIFY_METHOD: ${{ vars.NOTIFY_METHOD || 'email' }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_NUMBER: ${{ secrets.TWILIO_NUMBER }}
          MY_PHONE: ${{ secrets.MY_PHONE }}

      - name: Disable workflow after a failed login
        if: failure() && hashFiles('artifacts/login-failed') != ''
        run: gh workflow disable check-portal.yml
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      - name: Upload screenshots
        if: failure() || inputs.debug
        uses: actions/upload-artifact@v4
        with:
          name: portal-screenshots
          path: artifacts/
          if-no-files-found: ignore
